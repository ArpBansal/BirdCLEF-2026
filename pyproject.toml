[project]
name = "birdclef-taxonomy"
version = "0.1.0"
description = "BirdCLEF 2026 ProtoSSM training, inference, and taxonomy smoothing"
readme = "README.md"
authors = [
    { name = "arpbansal", email = "arpitbansal761943@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "librosa",
    "numpy",
    "onnxruntime",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "soundfile",
    "streamlit>=1.64.0",
    "torch>=2.9,<2.10",
    "tqdm",
]

[project.scripts]
birdclef-train = "src.train.train:main"
birdclef-infer = "inference.predict:main"
birdclef-prepare = "src.processing.prepare:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["src", "inference"]
module-root = ""
